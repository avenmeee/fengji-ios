# 云端 Mac 打包。只手动触发，不白用 macOS 分钟：
#   gh workflow run ios.yml -f mode=sim          只编译（不签名）+ 模拟器截图
#   gh workflow run ios.yml -f mode=testflight   签名打包，传 TestFlight
name: iOS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sim = 只编译不签名；testflight = 签名并传 TestFlight"
        type: choice
        options: [sim, testflight]
        default: sim
      shots:
        description: "sim 时截图"
        type: boolean
        default: true
      only:
        description: "sim 时只截名字里带这些字的（正则，空 = 全截）"
        type: string
        default: ""
      store:
        description: "sim 时再用 6.9 寸截商店图（线上真实页面）"
        type: boolean
        default: false
      pulltest:
        description: "sim 时真拉一下列表，录屏放 shots/（看下拉刷新）"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: 选最新的正式版 Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: 生成工程（XcodeGen）
        run: |
          brew install xcodegen
          xcodegen generate
          plutil -lint Fengji/Info.plist Fengji/Fengji.entitlements

      - name: 模拟器编译（不签名）
        if: inputs.mode == 'sim'
        run: |
          xcodebuild -project Fengji.xcodeproj -scheme Fengji -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -60; tail -40 build.log; exit 1; }
          echo "---- 警告（去重）----"
          grep -E "warning:" build.log | sed 's|.*/fengji-ios/||' | sort -u | head -40 || true
          test -x build/Build/Products/Debug-iphonesimulator/Fengji.app/Fengji
          # 只支持 iPhone：UIDeviceFamily 只能有 1
          plutil -extract UIDeviceFamily json -o - build/Build/Products/Debug-iphonesimulator/Fengji.app/Info.plist | tee /dev/stderr | grep -qx '\[1\]'

      - name: 同步 String Catalog（代码里的字有没有都进目录）
        if: inputs.mode == 'sim'
        run: |
          mkdir -p shots
          cp Fengji/Localizable.xcstrings shots/Localizable.xcstrings
          find build -name '*.stringsdata' > stringsdata.txt
          echo "stringsdata: $(wc -l < stringsdata.txt) 个"
          xargs xcrun xcstringstool sync shots/Localizable.xcstrings --stringsdata < stringsdata.txt || { xcrun xcstringstool sync --help; exit 1; }
          python3 -c "import json; a=json.load(open('Fengji/Localizable.xcstrings'))['strings']; b=json.load(open('shots/Localizable.xcstrings'))['strings']; print('目录里', len(a), '条；代码里', len(b), '条；没进目录', len(set(b)-set(a)), '条')"
          ls build/Build/Products/Debug-iphonesimulator/Fengji.app | grep -i lproj || echo "没有 lproj"

      - name: 模拟器里真拉一下列表并录屏
        if: inputs.mode == 'sim' && inputs.pulltest
        run: |
          UDID=$(python3 tools/pick-sim.py)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl ui "$UDID" appearance light
          mkdir -p shots
          # 先编译好再录，录屏里只有测试
          xcodebuild -project Fengji.xcodeproj -scheme FengjiUITests -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build-ui ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build-for-testing > shots/uibuild.log 2>&1 \
            || { grep -E "error:" shots/uibuild.log | sort -u | head -40; exit 1; }
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force shots/下拉刷新.mp4 &
          REC=$!
          sleep 2
          set +e
          xcodebuild -project Fengji.xcodeproj -scheme FengjiUITests -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build-ui ARCHS=arm64 CODE_SIGNING_ALLOWED=NO test-without-building > shots/uitest.log 2>&1
          CODE=$?
          set -e
          kill -INT "$REC"; wait "$REC" || true
          grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)|\*\* " shots/uitest.log | tail -30 || true
          exit $CODE

      - name: 模拟器里截图
        if: inputs.mode == 'sim' && inputs.shots
        env:
          ONLY: ${{ inputs.only }}
        run: |
          UDID=$(python3 tools/pick-sim.py)
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false  # 要弹软键盘才看得到挡不挡
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl status_bar "$UDID" override --time 9:41 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Fengji.app
          mkdir -p shots
          shot() {  # 名字 页面 外观
            if [ -n "$ONLY" ] && ! echo "$1" | grep -Eq "$ONLY"; then return 0; fi
            xcrun simctl terminate "$UDID" com.avenmeee.fengji || true
            xcrun simctl ui "$UDID" appearance "$3"
            xcrun simctl ui "$UDID" content_size "${4:-large}" || true
            SIMCTL_CHILD_SH_DEMO="$2" xcrun simctl launch "$UDID" com.avenmeee.fengji
            sleep 4
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
          }
          shot "1-买-浅色" buy light
          shot "2-买-深色" buy dark
          shot "3-详情-浅色" detail light
          shot "4-详情-深色" detail dark
          shot "5-详情-没登录" guest-detail light
          shot "14-分享图" sharecard light
          shot "6-我-浅色" me light
          shot "7-我-深色" me dark
          shot "8-发布-浅色" form light
          shot "15-再发一件" posted light
          shot "16-群里搬来" group light
          shot "17-认领" claim light
          shot "18-我-没登录" guest-me light
          shot "19-我-操作" mine-actions light
          shot "20-左滑后撤销" undo light
          shot "21-发布填好" form-filled light
          shot "22-发布填好-深" form-filled dark
          shot "23-出租填好" rentform-filled light
          shot "37-日历-选天" rentcal-day light
          shot "38-日历-选旬" rentcal-xun light
          shot "39-日历-选旬-深" rentcal-xun dark
          shot "40-日历-止" rentcal-to light
          shot "41-卖家主页" seller light
          shot "42-卖家主页-深" seller dark
          shot "43-群帖主页" seller-group light
          shot "44-详情弹层" detail-panel light
          shot "45-详情弹层-深" detail-panel dark
          shot "46-举报什么" detail-report light
          shot "47-详情-已卖出" detail-sold light
          shot "48-价格分说明" detail-score light
          shot "49-价格分说明-深" detail-score dark
          shot "29-加号弹层" plus-open light
          shot "30-加号弹层-深" plus-open dark
          shot "31-蜂巢1件" posted light
          shot "32-蜂巢3件" posted-3 light
          shot "33-蜂巢10件" posted-10 light
          shot "34-分享竖图" share-hive light
          shot "35-详情-想要" want-detail light
          shot "36-我-收到想要" wants light
          shot "24-键盘-搜索" search-kb light
          shot "25-键盘-价格" form-kb-price light
          shot "26-键盘-备注" form-kb-desc light
          shot "27-键盘-押金" rent-kb-deposit light
          shot "28-键盘-描述" rent-kb-desc light
          shot "9-租房-浅色" rent light
          shot "10-租房-深色" rent dark
          shot "11-房源详情" rentdetail light
          shot "12-出租房子-深色" rentform dark
          shot "13-设置-浅色" settings light
          shot "37-设置-邮箱" settings-contact light
          shot "38-返回手势自查" pop-check light
          shot "39-改昵称" profile light
          shot "40-卖了多少钱" sold-ask light
          shot "41-我的信息" myinfo light
          shot "41b-我的信息-深" myinfo dark
          shot "41c-我的信息-改一项" myinfo-edit light
          shot "50-屏蔽名单" blocked light
          shot "51-用户协议" terms light
          shot "52-举报处理" admin light
          shot "53-举报规则" rules light
          shot "60-登录" login light
          shot "61-登录-深" login dark
          shot "62-想要" want-sheet light
          shot "63-想要-没填" want-empty light
          shot "64-原帖人删除" owner-ask light
          shot "65-认领" claim light
          shot "66-认领好了" claim-done light
          shot "67-发布成功" posted-3 light
          shot "89-照片多" form-many light
          shot "90-这些照片是" batch-choose light
          shot "91-这些照片是-深" batch-choose dark
          shot "92-正在认" batch-recognize light
          shot "93-确认页" batch-confirm light
          shot "94-确认页-深" batch-confirm dark
          shot "95-移到别的件" batch-move light
          shot "96-删一件" batch-removed light
          shot "97-AI没认出来" batch-failed light
          shot "98-漏填" batch-missing light
          shot "68-发布成功-深" posted-3 dark
          shot "69-搜索" search-hit light
          shot "70-搜索没找到" search-none light
          shot "71-首页没人发" feed-empty light
          shot "72-连不上" feed-offline light
          shot "73-帖子没有了" detail-gone light
          shot "74-我还没发过" me-empty light
          shot "75-发布缺必填" form-missing light
          shot "80-大字-发布" form-filled light extra-extra-large
          shot "81-大字-出租" rentform-filled light extra-extra-large
          shot "82-大字-设置" settings light extra-extra-large
          shot "83-大字-我" wants light extra-extra-large
          shot "84-大字-详情" detail light extra-extra-large
          shot "85-大字-我的信息" myinfo light extra-extra-large
          shot "86-大字-买" buy light extra-extra-large
          shot "87-大字-记录" records light extra-extra-large
          shot "42-记录" records light
          shot "43-举报规则" rules light
          shot "44-设置-深" settings dark

      - name: 商店截图
        if: inputs.mode == 'sim' && inputs.store
        run: |
          UDID=$(python3 tools/pick-sim.py max)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl status_bar "$UDID" override --time 9:41 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Fengji.app
          mkdir -p shots/store
          store() {  # 名字 页面
            xcrun simctl terminate "$UDID" com.avenmeee.fengji || true
            xcrun simctl ui "$UDID" appearance light
            SIMCTL_CHILD_SH_DEMO="$2" xcrun simctl launch "$UDID" com.avenmeee.fengji
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/store/$1.png"
          }
          store "1-买东西" live-buy
          store "2-详情" live-detail
          store "3-租房子" live-rent
          store "4-房源详情" live-rentdetail
          store "5-发布" form-filled

      - name: 签名打包，传 TestFlight
        if: inputs.mode == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          BUILD_NO: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ] || [ -z "$DIST_P12" ] || [ -z "$PROFILE_APP" ]; then
            echo "缺 secrets 或 vars.TEAM_ID"; exit 1
          fi
          KC="$RUNNER_TEMP/app.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          printf '%s' "$PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/p.mobileprovision" > "$RUNNER_TEMP/p.plist"
          U=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/p.plist")
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$U.mobileprovision"
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$U.mobileprovision"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project Fengji.xcodeproj -scheme Fengji -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NO" \
            archive > archive.log 2>&1 \
            || { grep -E "error:" archive.log | sort -u | head -60; tail -40 archive.log; rm -f "$KEY"; exit 1; }
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.avenmeee.fengji</key><string>Fengji AppStore</string>
            </dict>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            "${AUTH[@]}" > export.log 2>&1 \
            || { grep -E "error:|Error" export.log | sort -u | head -60; tail -40 export.log; rm -f "$KEY"; exit 1; }
          rm -f "$KEY"
          echo "传上去了：构建号 ${BUILD_NO}。"

      - name: 留下截图和日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fengji-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            shots/
            build.log
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 14
