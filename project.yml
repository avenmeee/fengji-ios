# 蜂集 iOS。工程文件在 GitHub Actions 的 Mac 上用 XcodeGen 现生成：xcodegen generate
name: Fengji
options:
  bundleIdPrefix: com.avenmeee
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    # 界面文字走 Fengji/Localizable.xcstrings，中文是基础语言
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Fengji:
    type: application
    platform: iOS
    sources:
      - path: Fengji
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avenmeee.fengji
        # XcodeGen 的 iOS 预设在 target 上写 1,2，会盖掉上面的；这里再写一次，只支持 iPhone
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Fengji/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fengji/Fengji.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Fengji AppStore
schemes:
  Fengji:
    build:
      targets:
        Fengji: all
    run:
      config: Debug
    archive:
      config: Release
